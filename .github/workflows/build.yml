name: Build Package

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    env:
      THEOS: ${{ github.workspace }}/theos
      FINALPACKAGE: 1
      GITHUB_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          brew update
          brew install make dpkg ldid xz
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Set up Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git "$THEOS"
          mkdir -p "$THEOS/sdks"
          curl -L https://github.com/theos/sdks/archive/refs/heads/master.tar.gz \
            | tar -xz -C "$THEOS/sdks" --strip-components=1

      - name: Install AltList build framework
        run: |
          set -euo pipefail
          mkdir -p /tmp/altlist
          python3 - <<'PY'
          import json, os, urllib.request

          token = os.environ.get('GITHUB_TOKEN')
          req = urllib.request.Request(
              'https://api.github.com/repos/opa334/AltList/releases/latest',
              headers={
                  'Accept': 'application/vnd.github+json',
                  'User-Agent': 'Immortalizer-GitHub-Actions',
                  **({'Authorization': f'Bearer {token}'} if token else {})
              }
          )
          data = json.load(urllib.request.urlopen(req))
          assets = data.get('assets', [])
          debs = [a['browser_download_url'] for a in assets if a.get('name', '').endswith('.deb')]
          if not debs:
              raise SystemExit('No AltList .deb asset found')
          print(debs[0])
          urllib.request.urlretrieve(debs[0], '/tmp/altlist/altlist.deb')
          PY
          dpkg-deb -x /tmp/altlist/altlist.deb /tmp/altlist/root
          mkdir -p "$THEOS/lib" "$THEOS/include"
          if [ -d /tmp/altlist/root/Library/Frameworks/AltList.framework ]; then
            cp -R /tmp/altlist/root/Library/Frameworks/AltList.framework "$THEOS/lib/"
            cp -R /tmp/altlist/root/Library/Frameworks/AltList.framework/Headers "$THEOS/include/AltList"
          else
            echo 'AltList.framework not found in deb' >&2
            find /tmp/altlist/root -maxdepth 4 -type d -name 'AltList.framework' -print
            exit 1
          fi

      - name: Build package
        run: |
          make --version
          make clean package

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: packages/*.deb
          if-no-files-found: error
