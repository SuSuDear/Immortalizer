name: Build Package

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    env:
      THEOS: ${{ github.workspace }}/theos
      FINALPACKAGE: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          brew update
          brew install make dpkg ldid xz
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Set up Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git "$THEOS"
          mkdir -p "$THEOS/sdks"
          curl -L https://github.com/theos/sdks/archive/refs/heads/master.tar.gz \
            | tar -xz -C "$THEOS/sdks" --strip-components=1

      - name: Install AltList build framework
        run: |
          set -euo pipefail
          mkdir -p /tmp/altlist
          curl -L \
            -o /tmp/altlist/altlist.deb \
            https://opa334.github.io/debs/com.opa334.altlist_1.0.11_iphoneos-arm64.deb
          dpkg-deb -x /tmp/altlist/altlist.deb /tmp/altlist/root
          mkdir -p "$THEOS/lib" "$THEOS/include"
          ALTLIST_FRAMEWORK=""
          for candidate in             /tmp/altlist/root/Library/Frameworks/AltList.framework             /tmp/altlist/root/var/jb/Library/Frameworks/AltList.framework; do
            if [ -d "$candidate" ]; then
              ALTLIST_FRAMEWORK="$candidate"
              break
            fi
          done

          if [ -z "$ALTLIST_FRAMEWORK" ]; then
            echo 'AltList.framework not found in deb' >&2
            find /tmp/altlist/root -maxdepth 6 -print
            exit 1
          fi

          cp -R "$ALTLIST_FRAMEWORK" "$THEOS/lib/"
          cp -R "$ALTLIST_FRAMEWORK/Headers" "$THEOS/include/AltList"

      - name: Build package
        run: |
          make --version
          make clean package

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: packages/*.deb
          if-no-files-found: error
